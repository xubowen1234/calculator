# =============================================================================
# GitHub Actions workflow for the Calculator project (Lab 5 + Lab 6)
# File: .github/workflows/ci-calculator.yml
#
# Lab 5: on every push to main (or PR against main), a fresh Ubuntu VM
#        compiles the project and runs all JUnit 5 tests.
# Lab 6: after tests pass, the same VM builds the Docker image and pushes
#        it to Docker Hub (xubowen12345/calculator:lab6).
# =============================================================================

name: CI for Calculator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lab 5 job: compile + run JUnit tests on JDK 17 and JDK 21 in parallel.
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Compile all sources
        run: mvn -B clean compile

      - name: Run JUnit tests
        run: mvn -B test

  # ---------------------------------------------------------------------------
  # Lab 6 job: build the Docker image and push it to Docker Hub.
  # Only runs after build-and-test is green (needs:).
  # ---------------------------------------------------------------------------
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Set up Docker Buildx (the modern builder used by build-push-action).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using repository secrets:
      #   DOCKERHUB_USERNAME -> xubowen12345
      #   DOCKERHUB_PASSWORD  -> Docker Hub password / access token
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build the multi-stage image and push it to Docker Hub.
      # tags: lab6 (required by the task) + latest.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            xubowen12345/calculator:lab6
            xubowen12345/calculator:latest

      - name: Show image digest
        run: echo "Image pushed to Docker Hub as xubowen12345/calculator:lab6"
